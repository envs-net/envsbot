name: Bug report
description: Report a reproducible EnvsBot problem
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove secrets, passwords, tokens,
        private JIDs, private room data, and sensitive logs before submitting.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: EnvsBot did ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible example.
      placeholder: |
        1. Configure ...
        2. Run command ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: EnvsBot version / commit
      placeholder: v1.0.0 or commit hash
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.13.x

  - type: input
    id: xmpp_server
    attributes:
      label: XMPP server / Prosody version
      placeholder: Prosody 13.x, ejabberd, etc.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Commands / help output
        - Plugins / plugin manager
        - Users / roles / permissions
        - Rooms / room feature toggles
        - XMPP messaging / direct messages / MUC PM
        - Database
        - Audit log
        - Backups / restore
        - Config / reload
        - vCard / avatar
        - RSS / URL checks
        - Tests / CI
        - Documentation
        - Other

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Paste only relevant settings. Remove secrets/passwords.
      render: python

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. Redact secrets and private data.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed passwords, tokens, secrets, and private data from this report.
          required: true
        - label: I searched existing issues before opening this one.
          required: false
