name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            constraints: constraints/python312.txt
          - python-version: "3.13"
            constraints: constraints/python313.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ${{ matrix.constraints }}
      - run: python -m pip install -c ${{ matrix.constraints }} -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/check_constraints.py ${{ matrix.constraints }}
      - run: ./scripts/quality.sh
      - run: python -m build
      - run: pytest -W error::RuntimeWarning -W error::DeprecationWarning
