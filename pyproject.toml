[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envsbot"
version = "1.4.0"
description = "A modular plugin-driven XMPP bot framework"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "~dan", email = "fab@redterminal.org" },
    { name = "~creme", email = "creme@envs.net" },
]

license = { text = "GPL-3.0-only" }

dependencies = [
    "aiosqlite>=0.20,<1",
    "aiohttp>=3.8,<4",
    "beautifulsoup4>=4.12.3,<5",
    "dnspython>=2.3,<3",
    "feedparser>=6.0.8,<7",
    "isodate>=0.6,<1",
    "psutil>=5.9,<8",
    "pytz>=2023.3",
    "requests>=2.31,<3",
    "slixmpp>=1.8,<2",
]

keywords = [
    "xmpp",
    "chatbot",
    "bot",
    "xmpp-bot",
    "plugins",
    "automation"
]

classifiers = [
    "Development Status :: 5 - Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: XMPP",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
]

[project.scripts]
envsbot = "envsbot:cli"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "flake8>=6.0",
    "isort>=5.12",
    "mutmut>=3.0",
    "mypy>=1.8",
    "pytest>=8.0,<10",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.11",
]

[tool.setuptools]
py-modules = ["envsbot", "config_sample", "vcard_sample"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core_plugins*", "plugins*", "database*", "utils*"]
exclude = ["tests*", "mutants*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.data-files]
"." = ["init_chat_slang.csv", "avatar.jpg"]



[tool.mutmut]
# The project uses a flat layout plus package directories, so mutmut cannot
# reliably auto-detect the code paths. Keep this explicit.
source_paths = [
    "envsbot.py",
    "core_plugins/",
    "plugins/",
    "database/",
    "utils/",
]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["--no-cov", "-q"]
also_copy = [
    "config_sample.py",
    "vcard_sample.py",
    "init_chat_slang.csv",
]

[tool.pytest.ini_options]
# asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [ "-v", "--cov=.", "--cov-report=term" ]
filterwarnings = [
  "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning"
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
