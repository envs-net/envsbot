[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envsbot"
dynamic = ["version"]
description = "A modular plugin-driven XMPP bot framework"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "~dan", email = "fab@redterminal.org" },
    { name = "~creme", email = "creme@envs.net" },
]

license = "GPL-3.0-only"

dependencies = [
    "aiosqlite>=0.20,<1",
    "aiohttp>=3.14.3,<4",
    "beautifulsoup4>=4.12.3,<5",
    "dnspython>=2.3,<3",
    "feedparser>=6.0.8,<7",
    "isodate>=0.6,<1",
    "psutil>=5.9,<8",
    "pytz>=2023.3",
    "slixmpp>=1.8,<2",
]

keywords = [
    "xmpp",
    "chatbot",
    "bot",
    "xmpp-bot",
    "plugins",
    "automation"
]

classifiers = [
    "Development Status :: 5 - Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: XMPP",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
]

[project.scripts]
envsbot = "envsbot:cli"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "build>=1.2,<2",
    "flake8>=6.0",
    "isort>=5.12",
    "mutmut>=3.0",
    "mypy>=1.8",
    "pytest>=8.0,<10",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.11",
    "ruff>=0.9,<1",
    "pip-audit>=2.7,<3",
]

[tool.setuptools]
py-modules = ["envsbot", "config_sample", "vcard_sample"]

[tool.setuptools.dynamic]
version = { attr = "utils.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "core_plugins*", "plugins*", "database*", "utils*"]
exclude = ["tests*", "mutants*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
utils = ["bundled/*.csv", "bundled/*.jpg"]

[tool.mutmut]
# The project uses a flat layout plus package directories, so mutmut cannot
# reliably auto-detect the code paths. Keep this explicit.
source_paths = [
    "envsbot.py",
    "bot/",
    "core_plugins/",
    "plugins/",
    "database/",
    "utils/",
]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["--no-cov", "-q", "-x", "--tb=short", "--disable-warnings"]
# Mutate only statements actually exercised by the clean suite.  Mutmut 3
# otherwise mutates every line of a function as soon as that function is hit
# once, which turns unexecuted branches into misleading survivors.
mutate_only_covered_lines = true
# Exact logging text is operational telemetry rather than program semantics.
# Keep mutations for returned/replied/admin-alert text; only logging calls are
# excluded from the mutation surface.
do_not_mutate_patterns = [
    '(?:^|\.)(?:log|logger)\.(?:debug|info|warning|error|exception|critical)\(',
]
also_copy = [
    "config_sample.py",
    "vcard_sample.py",
]

[tool.pytest.ini_options]
# asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [ "-v", "--cov=.", "--cov-report=term" ]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["mutants", ".venv", "venv"]

[tool.ruff.lint]
# Start with correctness-critical rules so the gate can be enabled immediately.
# Style rules can be expanded gradually without a repository-wide rewrite.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
