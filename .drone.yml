---
kind: pipeline
type: docker
name: pytest

steps:
- name: build pytest
  image: python:3.12
  commands:
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - python -m compileall -q .
    - python scripts/check_command_docs.py
    - pytest
  trigger:
    branch:
      - main
    event:
      - tag
