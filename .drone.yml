---
kind: pipeline
type: docker
name: pytest-3.12

steps:
- name: quality-and-test
  image: python:3.12
  commands:
    - pip install -c constraints/python312.txt -r requirements.txt -r requirements-dev.txt
    - python -m pip check
    - ./scripts/quality.sh
    - python -m build
    - pytest -W error::RuntimeWarning -W error::DeprecationWarning

trigger:
  event:
    - push
    - pull_request
    - tag

